<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Gamefeel Benchmark</title>
<meta name="description" content="A creativity benchmark for AI models on game development: each model adds content and balance changes to 12 unpublished games, and is scored on coding, gamefeel, creativity and reverse-evaluation." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" title="All sections"><span class="burger"><i></i><i></i><i></i></span></button>
    <div class="brand"><img class="brand-ico" src="favicon.svg" alt="" width="32" height="32" /><div>The Gamefeel Benchmark<small>AI models on real dev tasks</small></div></div>
    <button id="sideToggle" type="button" aria-pressed="true" title="Show or hide the model list"><span class="glyph">◧</span>Models</button>
    <nav class="tabs" id="tabs"></nav>
    <label class="ver-wrap" title="Switch benchmark version (v1.2 to latest)">
      <span class="ver-lbl">Version</span>
      <select id="verSelect" aria-label="Benchmark version"></select>
    </label>
    <div class="meta" id="meta"></div>
  </header>
  <aside class="side">
    <div class="side-head"><b>Models</b><span id="shown"></span></div>
    <div class="side-tools">
      <input id="q" type="search" placeholder="filter by name or lab" />
      <button id="showAll" type="button">all</button>
      <button id="hideAll" type="button">none</button>
    </div>
    <div class="model-list" id="modelList"></div>
    <div class="side-foot">Tick a model to show or hide it in every chart. Hover a model to spotlight it.</div>
  </aside>
  <main class="main">
    <div class="controls" id="controls"></div>
    <div class="ver-banner" id="verBanner" hidden></div>
    <div class="stage" id="stage"><div class="fig"><p class="notice">Loading the data…</p></div></div>
  </main>
</div>
<nav class="menu" id="menu" hidden></nav>
<div class="tip" id="tip"></div>
<div id="exportStage"></div>

<script src="app.js"></script>
</body>
</html>
