<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Gamefeel Benchmark</title>
<meta name="description" content="A creativity benchmark for AI models on game development: each model adds content and balance changes to 12 unpublished games, and is scored on coding, gamefeel, creativity and reverse-evaluation." />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="stylesheet" href="style.css" />
<script>try { var t = localStorage.getItem('gfTheme'); document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="menuBtn" type="button" aria-expanded="false" aria-controls="menu" title="All sections"><span class="burger"><i></i><i></i><i></i></span></button>
    <div class="brand"><img class="brand-ico" src="favicon.svg" alt="" width="32" height="32" /><div><span class="brand-full">The Gamefeel Benchmark</span><span class="brand-short">GameFeel</span><small>AI models on real dev tasks</small></div></div>
    <button id="sideToggle" type="button" aria-pressed="true" title="Show or hide the model list"><span class="glyph">◧</span>Models</button>
    <nav class="tabs" id="tabs"></nav>
    <label class="gsearch" title="Search models or labs (press /)"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="gq" type="search" placeholder="Search models or labs" autocomplete="off" aria-label="Search models or labs" /><kbd>/</kbd></label>
    <div class="ver-drop" id="verDrop">
      <button id="verBtn" type="button" class="ver-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="verMenu" title="Switch benchmark version (v1.2 to latest)">
        <span class="ver-lbl">Version</span>
        <span class="ver-val" id="verVal">v1.5.3</span>
        <svg class="ver-chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.25 6 7.75l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="ver-menu" id="verMenu" role="listbox" aria-label="Benchmark version" hidden></div>
    </div>
    <div class="meta" id="meta"></div>
    <button id="themeBtn" type="button" title="Switch between light and dark" aria-label="Switch between light and dark"><svg class="i-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><svg class="i-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 1.8v2.1M10 16.1v2.1M1.8 10h2.1M16.1 10h2.1M4.2 4.2l1.5 1.5M14.3 14.3l1.5 1.5M4.2 15.8l1.5-1.5M14.3 5.7l1.5-1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
  </header>
  <aside class="side">
    <div class="side-head"><b>Models</b><span id="shown"></span></div>
    <div class="side-tools">
      <input id="q" type="search" placeholder="filter by name or lab" />
      <button id="showAll" type="button">all</button>
      <button id="hideAll" type="button">none</button>
    </div>
    <div class="lab-pills" id="labPills" role="group" aria-label="Filter by lab"></div>
    <div class="model-list" id="modelList"></div>
  </aside>
  <main class="main">
    <div class="controls" id="controls"></div>
    <div class="ver-banner" id="verBanner" hidden></div>
    <div class="stage" id="stage"><div class="fig"><p class="notice">Loading the data…</p></div></div>
  </main>
</div>
<nav class="menu" id="menu" hidden></nav>
<div class="tip" id="tip"></div>
<div id="exportStage"></div>

<script src="app.js"></script>
</body>
</html>
